site:
  title: Local Preview
  start_page: quick-docs::index.adoc
content:
  sources:
   - url: .
     branches: HEAD
   - url: https://gitlab.com/fedora/docs/community-tools/documentation-contributors-guide.git
     branches: main
ui:
  bundle:
    url: https://gitlab.com/fedora/docs/docs-website/ui-bundle/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  default_layout: with_menu
output:
  clean: true
  dir: ./public
  destinations:
  - provider: archive
runtime:
  fetch: true
  cache_dir: ./cache
